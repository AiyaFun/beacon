# 烽火台入口反代（挂载到 /etc/nginx/nginx.conf，整份替换官方默认配置）。
#
# 为什么整份替换而不是丢一个 conf.d 片段：官方镜像自带的 conf.d/default.conf 也监听 80，
# 叠加后「哪个 server 生效」要靠 default_server 规则去推。这份配置的核心是 XFF 语义，
# 而 XFF 语义**必须一眼可查、不能靠默认值**，所以入口只有这一个文件。
#
# 证书：期望 /etc/nginx/certs/{fullchain,privkey}.pem 存在，没有则 nginx 起不来。
#       先跑 deploy/cert.sh（自签或 Let's Encrypt）再 docker compose up -d。

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志里记 $remote_addr（反代亲眼看到的对端），不是 XFF —— XFF 客户端可伪造，
    # 记进日志会污染事后溯源。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;          # 不回显版本号

    # WebSocket：只有真的 Upgrade 请求才回 "upgrade"，普通请求回 "close"。
    # 直接写死 Connection "upgrade" 是常见抄错 —— 会把普通请求的 keepalive 也搞坏。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream beacon_web {
        # compose 内部网络里的服务名。web 不对外暴露 3000，只有本反代能连。
        server web:3000;
    }

    # ── 80：只干两件事，ACME 校验 + 全量跳 HTTPS ──────────────────
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # Let's Encrypt http-01 校验（deploy/cert.sh 用）。必须在跳转之前。
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # compose healthcheck 用。精确匹配，优先级高于下面的 301，所以不会被跳转掉。
        # 只回 ok，不透露任何内部状态；也不跳 HTTPS（否则健康检查要处理自签证书）。
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 其余一律跳 HTTPS。登录 Cookie 是 Secure 的，明文 HTTP 根本登不上。
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 443：TLS 终止 + 反代到 web ───────────────────────────────
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 请求体上限：Server Action 的 JSON 仍受 Next 自身 1MB 限制；两条 Route Handler 会更大——
        #   /api/video/analyze 内联视频（≤50MB，见 lib/llm/ark.ts MAX_INLINE_VIDEO_BYTES）
        #   /api/cover/generate 参考图 data URL（≤3 张 ×1MB，base64 后 ≈4.1MB）
        # 生产用的是宝塔 nginx（不在仓库里），部署时确认那边的 client_max_body_size 不低于此值。
        client_max_body_size 60m;

        location / {
            proxy_pass         http://beacon_web;
            proxy_http_version 1.1;

            # ★★★ 整个反代的存在理由就是下面这一行 ★★★
            # 覆写（$remote_addr），**不是**追加（$proxy_add_x_forwarded_for）：
            # 客户端自带的 XFF 整段丢掉，只写 nginx 亲眼看到的对端 IP。
            # → XFF 恒为 1 个值，与 BEACON_TRUSTED_PROXY_HOPS="1" 严格对应。
            # 攻击者塞多少个假值都撑不歪跳数（实测：XFF: "9.9.9.9, 8.8.8.8, 7.7.7.7"
            # 仍读出真实 IP）。改这行前先读 docs/生产化部署.md「反代必须覆写 XFF」。
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Real-IP         $remote_addr;

            # Next 只在这些头**缺失**时才自己填（`??=`），客户端带了就原样透传。
            # 所以必须由反代**无条件覆写**，否则客户端可以伪造 proto/host。
            proxy_set_header   X-Forwarded-Proto $scheme;   # 443 上恒为 https → Secure Cookie 才认
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Host              $host;

            # WebSocket
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # LLM 生成可能跑很久，别让反代先把连接掐了
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
