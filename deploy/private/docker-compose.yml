# 烽火台 · 私有化部署编排（客户自己的云 / 内网）
#
# 与生产编排（../../docker-compose.yml）的差别只有三处，其余保持同构，方便同一套运维手册通用：
#   ① **不含 xray 出海代理** —— 在客户机房架翻墙代理过不了企业安全审查。
#   ② **数据库自带**（生产版用的是火山托管 Supabase；私有化客户要的是"东西都在我这儿"）。
#   ③ 形态标成 private：无支付、无短信、AI 全 BYOK、首启走 /setup 装机向导。
#
# 首次部署：
#   cp .env.private.example .env.private && vi .env.private     # 填主密钥、库密码、站点域名
#   docker compose -f deploy/private/docker-compose.yml up -d db
#   DATABASE_URL="postgresql://beacon:<PWD>@localhost:5432/beacon?schema=beacon" scripts/db-init-supabase.sh
#   docker compose -f deploy/private/docker-compose.yml up -d
#   然后浏览器打开站点，用 .env.private 里的 BEACON_SETUP_TOKEN 完成装机。
#
# ⚠️ db-init 脚本已改成遍历 prisma/postgres/*.sql 全部应用（含 pgvector / RLS / 各版本增量），
#    不再有"部署前记得手动建某张表"这一步。新增 SQL 放进那个目录即可，脚本无需改。

# 数据库是**火山引擎 Supabase 版**托管 Postgres(pgvector)，不在本编排里 ——
# web/worker 走 .env.production 的 DATABASE_URL 外部加密连接串（见 docs/火山Supabase迁移.md）。
# 起：先 deploy/cert.sh 备好证书，再 docker compose up -d ；首次初始化见 docs/生产化部署.md。
#
# 暴露面：**只有 proxy 的 80/443 对外**。web/redis 都不对公网开口，仅在 compose 内部网络里以服务名互访；
# 数据库在火山侧，走公网/私网连接串（见 docs）。本机调试连 Redis 时，复制
# docker-compose.override.yml.example 为 docker-compose.override.yml（只绑 127.0.0.1）；
# 连数据库直接用火山连接串即可（psql/TablePlus/Studio），不经本编排。
#
# ⚠️ web 的 3000 **必须**收在 127.0.0.1（BEACON_WEB_BIND 默认值）。
#    一旦放成 0.0.0.0，攻击者就能直连 3000 绕开反代，自己伪造 X-Forwarded-For
#    换限流桶刷爆按条计费的短信 —— 实测直连时 `XFF: 9.9.9.9` 会被原样当成客户端 IP。
#    反代能挡住它，只是因为反代是**唯一**入口。

services:
  # 数据库：私有化版**自带** Postgres + pgvector（生产 SaaS 用的是火山托管 Supabase）。
  # 客户要的正是「数据在我自己机器上」，托管库与这个诉求相反。
  #
  # ⚠️ 镜像必须 ≥ 服务端 17.5 —— 备份/恢复演练踩过：pg_dump 版本低于服务端会直接拒绝。
  # 暴露面：**无 ports**，只在 compose 内网以服务名 db:5432 供 web/worker 访问。
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-beacon} -d ${POSTGRES_DB:-beacon}']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # 仅供下面的 healthcheck 用；密码同时出现在 command 里是有意的：
      # redis 官方 entrypoint 只在 $1 = 'redis-server' 时才 chown /data 并降权到 redis 用户，
      # 套一层 sh -c 会让它以 root 跑，得不偿失。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD（export REDIS_PASSWORD=$(openssl rand -hex 32)）}
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    healthcheck:
      # 带密码 ping：无密码时 redis-cli 返回 NOAUTH，grep 会失败 → 容器不健康
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    # 显式命名镜像：蓝绿的另一侧(web_b)靠这个名字复用**同一份**构建产物，
    # 保证切换期间两侧代码绝对一致（各自 build 一次则可能因缓存/时间差构建出不同产物）。
    image: beacon-web:latest
    restart: unless-stopped
    env_file: .env.production
    # 锚点给 web_b 复用：环境变量是最容易漂移的部分，
    # 复制粘贴迟早会出现「蓝绿两侧配置不一致」这种极难排查的故障。
    environment: &web-env
      # 形态：无支付、无短信、AI 全 BYOK、首启走 /setup 装机向导（lib/edition.ts）
      BEACON_EDITION: private
      # DATABASE_URL 不在这里注入：由 .env.production（env_file）提供火山 Supabase 外部连接串。
      # compose 不再覆盖它 → .env.production 里那一行就是最终值（含 sslmode/connection_limit 等参数）。
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BEACON_QUEUE: bullmq
      # 竞对监控·开源自建通道（方案二）：内部网络直连自建 RSSHub，不走公网。
      # 地址是固定的内部拓扑（非机密），放这里而不是 .env.production，避免误动密钥文件。
      BEACON_RSSHUB_BASE_URL: http://rsshub:1200
      # 热榜主源：自建 DailyHotApi（覆盖 抖音/微博/B站/知乎/百度/头条），60s 免费实例当备份。
      # 配了它就当热榜主通道，比免费公开实例稳、且多覆盖百度。小红书/YouTube/X 它不覆盖。
      BEACON_DAILYHOT_BASE_URL: http://dailyhot:6688
      # ⚠️ 私有化版**不含**出海代理：在客户机房里架翻墙代理过不了企业安全审查，
      #    也可能违反客户内部合规。代价是 YouTube 热榜取不到，适配器会自动降级
      #    （lib/adapters/registry.ts 逐源回退），其余数据源不受影响。
      #    客户自己有合规出口时，在这里补 BEACON_HTTP_PROXY 即可。
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    ports:
      # 默认只绑 127.0.0.1：公网进不来，反代走内部网络的 web:3000，不依赖这个映射。
      # 这个映射纯粹是留给宿主机上调试（curl 127.0.0.1:<宿主端口>）。
      # ⚠️ 改成 0.0.0.0 = 把反代整层绕过去，等于把 XFF 伪造漏洞装回来。别改。
      # 宿主端口用变量：本地 dev 默认 3000；生产共享机 3000 已被别的容器占，
      # deploy 时 export BEACON_WEB_PORT=8100（系统 nginx 反代目标），避免撞端口。
      - '${BEACON_WEB_BIND:-127.0.0.1}:${BEACON_WEB_PORT:-3000}:3000'

  # 蓝绿部署的「绿」侧：**只在部署那几十秒存在**，平时根本不启动（profiles 卡着）。
  # 由 scripts/deploy-swap.sh 编排：先把它拉起来接住流量，再重建主实例 web，最后删掉它。
  # 稳态因此与改造前完全一致（只有 web 在跑）——不多占内存，也不会出现两个版本同时对外服务。
  #
  # 不写 build：永远复用 web 构建出的 beacon-web:latest，蓝绿两侧代码保证同源。
  # 宿主端口由 BEACON_WEB_PORT_B 指定（生产 8101，见 deploy-swap.sh 里的 export），
  # 与宝塔 nginx 的 0.beacon-upstream.conf 里的 backup 上游严格对应。
  web_b:
    image: beacon-web:latest
    profiles: ['bluegreen']
    restart: unless-stopped
    env_file: .env.production
    environment: *web-env
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    ports:
      - '${BEACON_WEB_BIND:-127.0.0.1}:${BEACON_WEB_PORT_B:-3001}:3000'

  # 入口反代：唯一对公网开口的服务。TLS 终止 + 覆写 X-Forwarded-For。
  # 配置见 deploy/nginx.conf（XFF 语义就那一行，改之前先读 docs/生产化部署.md）。
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # 证书由 deploy/cert.sh 放进来。目录为空时 nginx 起不来 —— 这是故意的：
      # 没证书就没 HTTPS，没 HTTPS 则 Secure 的登录 Cookie 根本发不出去，起来了也登不上。
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme-webroot:/var/www/certbot:ro
    healthcheck:
      # 打 80 上的 /healthz（nginx.conf 里 return 200）。别改成打 / —— 那是 301 跳 HTTPS，
      # 也别打 acme-challenge 目录 —— 没有目录列表会回 403，wget 判失败，容器会永远 unhealthy。
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

  # Let's Encrypt 签发/续期。默认不启动，只被 deploy/cert.sh 按需拉起。
  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    volumes:
      - certbot-etc:/etc/letsencrypt
      - ./deploy/acme-webroot:/var/www/certbot
      - ./deploy/certs:/certs-out

  worker:
    build: .
    restart: unless-stopped
    command: ['node_modules/.bin/tsx', 'worker.ts']
    env_file: .env.production
    environment:
      # 形态：与 web 必须一致，否则后台任务会按 SaaS 口径跑（例如去撞平台预算闸）
      BEACON_EDITION: private
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BEACON_QUEUE: bullmq
      # 竞对监控·开源自建通道（方案二）：内部网络直连自建 RSSHub，不走公网。
      # 地址是固定的内部拓扑（非机密），放这里而不是 .env.production，避免误动密钥文件。
      BEACON_RSSHUB_BASE_URL: http://rsshub:1200
      # 热榜主源：自建 DailyHotApi（覆盖 抖音/微博/B站/知乎/百度/头条），60s 免费实例当备份。
      # 配了它就当热榜主通道，比免费公开实例稳、且多覆盖百度。小红书/YouTube/X 它不覆盖。
      BEACON_DAILYHOT_BASE_URL: http://dailyhot:6688
      # ⚠️ 私有化版**不含**出海代理：在客户机房里架翻墙代理过不了企业安全审查，
      #    也可能违反客户内部合规。代价是 YouTube 热榜取不到，适配器会自动降级
      #    （lib/adapters/registry.ts 逐源回退），其余数据源不受影响。
      #    客户自己有合规出口时，在这里补 BEACON_HTTP_PROXY 即可。
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }

  # 竞对监控·开源自建 RSSHub 实例（方案二）。
  # 暴露面：**无 ports**——只在 compose 内部网络里以服务名暴露给 web/worker（http://rsshub:1200），
  #        不对公网开口（和 redis 一样）。
  # 定位：竞对"发新内容"变更监控。RSS 无播放/点赞指标——指标靠商业 API 或浏览器插件回传补。
  #   · B站 / YouTube 路由免配置直接可用。
  #   · 抖音 / 小红书 路由需在本实例侧配 cookie 才可用（见 RSSHub 文档）；拿不到时 beacon 侧
  #     自动降级到下一通道，不硬闯。
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 缓存 1h：采集本就低频（crawl_competitors 每 2h 一轮），缓存进一步降低对源站的真实请求频率。
      CACHE_EXPIRE: '3600'

  # 热榜主源：自建 DailyHotApi（https://github.com/imsyy/DailyHotApi）。
  # 暴露面：**无 ports**——只在 compose 内网里以服务名给 web/worker（http://dailyhot:6688），不开公网。
  # 覆盖：抖音/微博/B站/知乎/百度/头条（见 lib/adapters/dailyhot.ts 的 ROUTE_MAP）。
  # 免费的 60s 公开实例当备份（单源失败逐源回退，见 lib/adapters/registry.ts）。小红书/YouTube/X 不覆盖。
  dailyhot:
    image: imsyy/dailyhot-api:latest
    restart: unless-stopped
    environment:
      PORT: '6688'

volumes:
  pgdata:
  redisdata:
  certbot-etc:
