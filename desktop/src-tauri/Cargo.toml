[package]
name = "beacon-desktop"
version = "1.2.5"
description = "烽火台整机版的桌面壳：窗口 + 托盘 + 开机自启，界面就是本机 localhost 的完整 Web 界面"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"   # 一键更新：查 /downloads/desktop-update.json，签名校验后原地升级
tauri-plugin-dialog = "2"    # 更新确认框（v2 的 updater 不带内置对话框）
tauri-plugin-process = "2"   # 装完重启自己
serde_json = "1"
tokio = { version = "1", features = ["time"] }  # 更新检查的 6 小时间隔  # 只用于把提示文案安全地转成 JS 字符串字面量

[profile.release]
codegen-units = 1
lto = true
strip = true
