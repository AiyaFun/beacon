<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>烽火台</title>
<style>
  :root { color-scheme: light dark; --fg:#1f1b16; --bg:#faf7f2; --brand:#e56b3c; --line:rgba(31,27,22,.14); }
  @media (prefers-color-scheme: dark) { :root { --fg:#efe9df; --bg:#17130e; --line:rgba(239,233,223,.18); } }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         display:flex; align-items:center; justify-content:center; height:100vh;
         background:var(--bg); color:var(--fg); position:relative; }
  .box { text-align:center; max-width:460px; padding:24px; }
  .logo { width:72px; height:72px; border-radius:18px; margin-bottom:18px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p  { font-size:13px; line-height:1.8; opacity:.75; margin:0 0 14px; }
  .spin { width:18px; height:18px; border:2.5px solid var(--brand); border-top-color:transparent;
          border-radius:50%; margin:0 auto 14px; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  code { background:rgba(229,107,60,.12); padding:2px 8px; border-radius:6px; font-size:12px; }
  .hide { display:none; }
  .pick { display:grid; gap:10px; margin-top:6px; text-align:left; }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer;
          background:transparent; color:inherit; font:inherit; text-align:left; }
  .card:hover { border-color:var(--brand); }
  .card b { display:block; font-size:14px; margin-bottom:4px; }
  .card span { font-size:12px; opacity:.7; line-height:1.7; }
  .row { display:flex; gap:8px; margin-top:4px; }
  input { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
          background:transparent; color:inherit; font:inherit; font-size:13px; }
  .go { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 16px;
        cursor:pointer; font:inherit; font-size:13px; }
  .link { background:none; border:0; color:var(--brand); cursor:pointer; font:inherit; font-size:12px;
          text-decoration:underline; padding:0; margin-top:10px; }
  .lang-toggle { position:absolute; top:16px; right:16px; display:inline-flex; border:1px solid var(--line);
                 border-radius:20px; padding:2px; font-size:11px; background:var(--bg); }
  .lang-btn { border:0; background:transparent; padding:3px 8px; border-radius:16px; cursor:pointer;
              font-family:inherit; color:inherit; opacity:.6; }
  .lang-btn.active { background:var(--brand); color:#fff; opacity:1; font-weight:600; }
</style>
</head>
<body>
<div class="lang-toggle">
  <button id="lang-zh" class="lang-btn active" onclick="setLocale('zh')">中文</button>
  <button id="lang-en" class="lang-btn" onclick="setLocale('en')">EN</button>
</div>

<div class="box">
  <img class="logo" src="logo.png" alt="" />

  <!-- ① 探测中 -->
  <div id="probing">
    <div class="spin"></div>
    <h1 id="probe-title">正在启动…</h1>
    <p id="probe-desc">正在检查这台电脑上有没有装整机版…</p>
  </div>

  <!-- ② 选连哪儿（本机没跑起来时出现） -->
  <div id="pick" class="hide">
    <h1 id="pick-title">连到哪一个烽火台？</h1>
    <p id="pick-desc">没检测到本机服务。你可以连云端账号，或先把整机版装起来。</p>
    <div class="pick">
      <button class="card" id="pick-cloud">
        <b id="pick-cloud-title">☁️ 连云端账号</b>
        <span id="pick-cloud-desc">用 <code id="cloud-host"></code> 上的账号，和浏览器里是同一个工作区。适合直接用 SaaS 的人。</span>
      </button>
      <button class="card" id="pick-local">
        <b id="pick-local-title">🖥️ 连本机整机版</b>
        <span id="pick-local-desc">数据全在这台机器上。还没装的话，在烽火台目录执行一次
          <code>bash deploy/appliance/install.sh</code>，装完开机自启，这里就能连上。</span>
      </button>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="custom" placeholder="或填自建地址，如 https://beacon.mycorp.com" />
      <button class="go" id="custom-go">进入</button>
    </div>
  </div>

  <!-- ③ 记住的选择连不上时 -->
  <div id="failed" class="hide">
    <h1 id="failed-title">连不上</h1>
    <p id="failed-desc"><code id="failed-addr"></code> 没有响应。检查网络，或换一个连接方式。</p>
    <button class="link" id="reset">换个地址</button>
  </div>
</div>
<script>
  const qs = new URLSearchParams(location.search);
  const PORT = qs.get('port') || '3070';
  const LOCAL = `http://localhost:${PORT}`;
  const CLOUD = qs.get('cloud') || 'https://beacon.iyunci.cn';
  const KEY = 'beacon.desktop.target';
  const LANG_KEY = 'beacon.lang';

  const I18N = {
    zh: {
      title: '烽火台',
      probeTitle: '正在启动…',
      probeDesc: '正在检查这台电脑上有没有装整机版…',
      pickTitle: '连到哪一个烽火台？',
      pickDesc: '没检测到本机服务。你可以连云端账号，或先把整机版装起来。',
      pickCloudTitle: '☁️ 连云端账号',
      pickCloudDescPrefix: '用 ',
      pickCloudDescSuffix: ' 上的账号，和浏览器里是同一个工作区。适合直接用 SaaS 的人。',
      pickLocalTitle: '🖥️ 连本机整机版',
      pickLocalDesc: '数据全在这台机器上。还没装的话，在烽火台目录执行一次 <code>bash deploy/appliance/install.sh</code>，装完开机自启，这里就能连上。',
      customPlaceholder: '或填自建地址，如 https://beacon.mycorp.com',
      goBtn: '进入',
      failedTitle: '连不上',
      failedSuffix: ' 没有响应。检查网络，或换一个连接方式。',
      resetBtn: '换个地址',
      localNotRunning: '（本机服务没在跑）'
    },
    en: {
      title: 'Beacon',
      probeTitle: 'Starting up…',
      probeDesc: 'Checking if local appliance instance is running…',
      pickTitle: 'Connect to Beacon',
      pickDesc: 'No local instance detected. Connect your cloud account or install the appliance.',
      pickCloudTitle: '☁️ Connect Cloud Account',
      pickCloudDescPrefix: 'Use your account on ',
      pickCloudDescSuffix: ', shared with your browser. Best for SaaS users.',
      pickLocalTitle: '🖥️ Connect Local Appliance',
      pickLocalDesc: 'All data stays on this machine. Run <code>bash deploy/appliance/install.sh</code> to install, then connect here.',
      customPlaceholder: 'Or enter custom address, e.g. https://beacon.mycorp.com',
      goBtn: 'Connect',
      failedTitle: 'Connection Failed',
      failedSuffix: ' is not responding. Check your network or switch connection.',
      resetBtn: 'Switch Address',
      localNotRunning: ' (local service is not running)'
    }
  };

  let curLang = 'zh';
  try {
    const savedLang = localStorage.getItem(LANG_KEY);
    if (savedLang === 'en' || (!savedLang && navigator.language && navigator.language.toLowerCase().startsWith('en'))) {
      curLang = 'en';
    }
  } catch {}

  const $ = (id) => document.getElementById(id);

  function setLocale(lang) {
    curLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
    document.documentElement.lang = lang;
    $('lang-zh').classList.toggle('active', lang === 'zh');
    $('lang-en').classList.toggle('active', lang === 'en');
    
    const d = I18N[lang] || I18N.zh;
    document.title = d.title;
    $('probe-title').textContent = d.probeTitle;
    $('probe-desc').textContent = d.probeDesc;
    $('pick-title').textContent = d.pickTitle;
    $('pick-desc').textContent = d.pickDesc;
    $('pick-cloud-title').textContent = d.pickCloudTitle;
    
    let host = CLOUD;
    try { host = new URL(CLOUD).host; } catch {}
    $('pick-cloud-desc').innerHTML = `${d.pickCloudDescPrefix}<code>${host}</code>${d.pickCloudDescSuffix}`;
    
    $('pick-local-title').textContent = d.pickLocalTitle;
    $('pick-local-desc').innerHTML = d.pickLocalDesc;
    $('custom').placeholder = d.customPlaceholder;
    $('custom-go').textContent = d.goBtn;
    $('failed-title').textContent = d.failedTitle;
    $('reset').textContent = d.resetBtn;
  }

  setLocale(curLang);

  function show(which) {
    for (const id of ['probing', 'pick', 'failed']) $(id).classList.toggle('hide', id !== which);
  }

  async function alive(base) {
    try {
      await fetch(`${base}/api/health`, { mode: 'no-cors', cache: 'no-store' });
      return true;
    } catch { return false; }
  }

  function remember(base) {
    try { localStorage.setItem(KEY, base); } catch {}
  }

  const CLIENT_VERSION = '1.2.6';
  function enter(base) {
    remember(base);
    const sep = base.includes('?') ? '&' : '?';
    location.replace(`${base}${sep}_client=desktop&_cv=${encodeURIComponent(CLIENT_VERSION)}&lang=${curLang}`);
  }

  async function boot() {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch {}
    if (saved) {
      if (await alive(saved)) return enter(saved);
      if (saved === LOCAL) {
        for (let i = 0; i < 6; i++) {
          await new Promise((r) => setTimeout(r, 1500));
          if (await alive(saved)) return enter(saved);
        }
      }
      $('failed-addr').textContent = saved;
      show('failed');
      return;
    }

    for (let i = 0; i < 3; i++) {
      if (await alive(LOCAL)) return enter(LOCAL);
      await new Promise((r) => setTimeout(r, 1200));
    }
    show('pick');
  }

  $('pick-cloud').onclick = () => enter(CLOUD);
  $('pick-local').onclick = async () => {
    if (await alive(LOCAL)) return enter(LOCAL);
    const d = I18N[curLang] || I18N.zh;
    $('failed-addr').textContent = `${LOCAL}${d.localNotRunning}`;
    show('failed');
  };
  $('custom-go').onclick = () => {
    let v = $('custom').value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = `https://${v}`;
    enter(v.replace(/\/+$/, ''));
  };
  $('custom').onkeydown = (e) => { if (e.key === 'Enter') $('custom-go').click(); };
  $('reset').onclick = () => {
    try { localStorage.removeItem(KEY); } catch {}
    show('pick');
  };

  boot();
</script>
</body>
</html>
